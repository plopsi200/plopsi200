<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Game 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Snack Game 2.0</h1>
        <div id="score-container">
            <span>Score: <span id="score">0</span></span>
            <span>Coins: <span id="coins">0</span></span>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="game-over-overlay" style="display: none;">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-button">Restart Game</button>
            </div>
        </div>

        <div id="shop-container">
            <h2>Shop</h2>
            <div class="shop-section">
                <h3>Snack Skins</h3>
                <div id="snack-skins" class="shop-items">
                    <!-- Skins will be injected here -->
                </div>
            </div>
            <div class="shop-section">
                <h3>Backgrounds</h3>
                <div id="backgrounds" class="shop-items">
                    <!-- Backgrounds will be injected here -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
